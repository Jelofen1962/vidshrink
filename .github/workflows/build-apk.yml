name: Build VidShrink APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # also adds a manual "Run workflow" button

permissions:
  contents: write           # needed to publish the Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p src
          unzip -q vidshrink.zip -d src
          ls -la src/vidshrink

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (cached)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('vidshrink.zip') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('vidshrink.zip') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Point Flutter at JDK 17 and accept Android licenses
        run: |
          flutter config --jdk-dir "$JAVA_HOME"
          yes | flutter doctor --android-licenses || true
          flutter --version

      - name: Generate Android project, patch Gradle, get packages
        working-directory: src/vidshrink
        run: dart setup.dart

      - name: Build release APKs
        working-directory: src/vidshrink
        run: flutter build apk --release --split-per-abi

      - name: List APKs
        run: ls -lh src/vidshrink/build/app/outputs/flutter-apk/

      - name: Save APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidshrink-apks
          path: src/vidshrink/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish a GitHub Release with the APKs
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VidShrink build ${{ github.run_number }}
          files: src/vidshrink/build/app/outputs/flutter-apk/*.apk
